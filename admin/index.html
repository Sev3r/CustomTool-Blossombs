<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blossombs Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="product-preview.css">
</head>

<body>
  <header class="app-topbar">
    <a class="app-brand" href="#creation" aria-label="Blossombs admin home">
      <img src="../shared/images/Blos-logo.webp" alt="Blossombs">
    </a>

    <nav class="topnav" aria-label="Hoofdnavigatie">
      <a href="#sales" class="nav-item" data-page="sales">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M3.5 11.5L9 6L13.1 10.1L16.4 6.8"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3.5 16H16.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>Sales</span>

        <span
          class="nav-badge"
          id="badge-sales"
        ></span>
      </a>

      <a href="#creation" class="nav-item" data-page="creation">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M10 16.2V9.5M10 9.7C6.9 9.7 4.7 7.8 4.6 4.8C7.7 4.8 9.6 6.5 10 9M10 9.2C10.6 6 12.7 4.2 15.7 4.2C15.6 7.4 13.4 9.3 10 9.2Z"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6.2 16.2H13.8"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>Creatie</span>

        <span
          class="nav-badge urgent"
          id="badge-creation"
        ></span>
      </a>

      <a href="#production" class="nav-item" data-page="production">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <circle
              cx="6.1"
              cy="6.1"
              r="2.3"
              stroke="currentColor"
              stroke-width="1.45"
            />
            <circle
              cx="13.9"
              cy="13.9"
              r="2.3"
              stroke="currentColor"
              stroke-width="1.45"
            />
            <path
              d="M7.7 7.7L12.3 12.3M4.4 13.7L13.7 4.4"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>Production</span>
      </a>

      <a href="#history" class="nav-item" data-page="history">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M6 6A6 6 0 1 1 4.1 10"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
            />
            <path
              d="M3.5 5.7H7.2V9.4"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M10 7V10.2L12.2 11.5"
              stroke="currentColor"
              stroke-width="1.45"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <span>History</span>

        <span
          class="nav-badge"
          id="badge-history"
        ></span>
      </a>
    </nav>

    <div class="topbar-actions">
      <button
        class="new-order-btn"
        id="btn-global-new-order"
        type="button"
      >
        <span aria-hidden="true">＋</span>
        <span>New</span>
        <span class="new-order-caret" aria-hidden="true">⌄</span>
      </button>

      <div class="settings-menu-wrap">
        <button
          class="settings-btn"
          id="btn-settings-menu"
          type="button"
          aria-label="Instellingen"
          aria-expanded="false"
          aria-controls="settings-menu"
        >
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M8.7 2.8H11.3L11.8 4.3C12.3 4.5 12.8 4.8 13.2 5.1L14.8 4.8L16.1 7.1L15 8.3C15.1 8.8 15.1 9.2 15 9.7L16.1 10.9L14.8 13.2L13.2 12.9C12.8 13.2 12.3 13.5 11.8 13.7L11.3 15.2H8.7L8.2 13.7C7.7 13.5 7.2 13.2 6.8 12.9L5.2 13.2L3.9 10.9L5 9.7C4.9 9.2 4.9 8.8 5 8.3L3.9 7.1L5.2 4.8L6.8 5.1C7.2 4.8 7.7 4.5 8.2 4.3L8.7 2.8Z"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linejoin="round"
            />
            <circle
              cx="10"
              cy="9"
              r="2.2"
              stroke="currentColor"
              stroke-width="1.25"
            />
          </svg>
        </button>

        <div
          class="settings-menu hidden"
          id="settings-menu"
        >
          <a
            href="#products"
            class="settings-menu-item"
          >
            Productbeheer
          </a>

          <button
            class="settings-menu-item danger"
            id="btn-reset-data"
            type="button"
          >
            Reset data
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div id="page-sales" class="page"></div>
    <div id="page-creation" class="page"></div>
    <div id="page-production" class="page"></div>
    <div id="page-archive" class="page"></div>
    <div id="page-products" class="page"></div>
  </main>

  <div
    id="modal-overlay"
    class="modal-overlay hidden"
  >
    <div
      class="modal"
      id="modal-box"
    >
      <div class="modal-header">
        <h2 id="modal-title">Modal</h2>

        <button
          class="modal-close"
          id="btn-modal-close"
          type="button"
          aria-label="Modal sluiten"
        >
          ✕
        </button>
      </div>

      <div
        class="modal-body"
        id="modal-body"
      ></div>

      <div
        class="modal-footer"
        id="modal-footer"
      ></div>
    </div>
  </div>

  <div
    id="toast"
    class="toast hidden"
  ></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dataService.js"></script>
  <script src="../shared/js/offertePdf.js"></script>
  <script src="orders.js"></script>
  <script src="../shared/js/printSpecs.js"></script>
  <script src="../shared/js/productPreview.js"></script>
  <script src="products.js"></script>
  <script src="admin.js"></script>
</body>

</html>
